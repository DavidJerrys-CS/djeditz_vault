<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJEDITZ | Anime Twixtor Clips</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #080204 url('https://raw.githubusercontent.com/DavidJerrys-CS/djeditz_vault/refs/heads/main/aot_bg.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      min-height: 100vh;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Dark Overlay for Readability */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 2, 4, 0.85);
      z-index: -1;
    }

    /* Navigation Bar */
    nav {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto 2.5rem auto;
      background: rgba(20, 5, 8, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 0, 51, 0.2);
      padding: 0.8rem 2rem;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    /* Cropped Circular Logo */
    .site-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff0033;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ff0033;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #ff0033;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      background: linear-gradient(45deg, #ff0033, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
    }

    header p {
      color: #b3a2a5;
      margin-top: 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* Instagram Banner */
    .insta-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1rem;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 0, 51, 0.08);
      border: 1px solid rgba(255, 0, 51, 0.3);
      border-radius: 20px;
      color: #ff3355;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .insta-banner:hover {
      background: rgba(255, 0, 51, 0.2);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
      color: #fff;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .search-input, .filter-select {
      background: rgba(20, 5, 8, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 51, 0.2);
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }

    .search-input:focus, .filter-select:focus {
      border-color: #ff0033;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
    }

    .filter-select option {
      background: #120306;
      color: #fff;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: rgba(20, 5, 8, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 0, 51, 0.15);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #ff0033;
      box-shadow: 0 10px 25px rgba(255, 0, 51, 0.25);
    }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 270px;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img {
      transform: scale(1.08);
    }

    /* Eye Overlay Animation */
    .eye-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .eye-lid {
      width: 100%;
      height: 50%;
      background: #000;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eye-lid.top { transform: translateY(-100%); }
    .eye-lid.bottom { transform: translateY(100%); }

    .card:hover .eye-lid.top {
      animation: eyeBlinkTop 0.6s forwards;
    }
    .card:hover .eye-lid.bottom {
      animation: eyeBlinkBottom 0.6s forwards;
    }

    @keyframes eyeBlinkTop {
      0% { transform: translateY(-100%); }
      40% { transform: translateY(-10%); }
      60% { transform: translateY(-10%); }
      100% { transform: translateY(-100%); }
    }

    @keyframes eyeBlinkBottom {
      0% { transform: translateY(100%); }
      40% { transform: translateY(10%); }
      60% { transform: translateY(10%); }
      100% { transform: translateY(100%); }
    }

    .card-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      background: rgba(8, 2, 4, 0.8);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: #fff;
    }

    .card-role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff0033;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .btn-download {
      display: block;
      text-align: center;
      background: linear-gradient(45deg, #cc0029, #ff0033);
      color: #fff;
      text-decoration: none;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.2);
    }

    .btn-download:hover {
      background: linear-gradient(45deg, #ff0033, #ff3355);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
    }
  </style>
</head>

    function renderCards(data) {
      const grid = document.getElementById('characterGrid');
      grid.innerHTML = '';
      
      data.forEach(char => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-role', char.role);

        card.innerHTML = `
          <div class="card-img-container">
            <div class="eye-overlay">
              <div class="eye-lid top"></div>
              <div class="eye-lid bottom"></div>
            </div>
            <img src="${char.img}" alt="${char.name}" class="card-img" onerror="this.src='https://via.placeholder.com/300x400/080204/ff0033?text=${encodeURIComponent(char.name)}'">
          </div>
          <div class="card-info">
            <div>
              <div class="card-title">${char.name}</div>
              <div class="card-role">${char.role}</div>
            </div>
            <a href="${char.link}" target="_blank" class="btn-download">Get Clips</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCards() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const roleVal = document.getElementById('roleFilter').value;

      const filtered = characters.filter(char => {
        const matchesSearch = char.name.toLowerCase().includes(searchVal);
        const matchesRole = roleVal === 'all' || char.role === roleVal;
        return matchesSearch && matchesRole;
      });

      renderCards(filtered);
    }

    renderCards(characters);
  </script>
