<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJEDITZ VAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070a;color:#fff;font-family:'Rajdhani',sans-serif}
.header{padding:22px;text-align:center;border-bottom:1px solid #00e5ff33;position:sticky;top:0;background:#05070acc;backdrop-filter:blur(10px)}
.logo{font-family:'Orbitron';font-size:26px;font-weight:900;letter-spacing:2px}
.logo span{color:#00e5ff;text-shadow:0 0 15px #00e5ff}
.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:9/12;background:#111;border:1px solid #ffffff12}
.card img{width:100%;height:100%;object-fit:cover;object-position:top}
.card:hover{border-color:#00e5ff;box-shadow:0 0 25px #00e5ff44}
.ov{position:absolute;inset:0;background:linear-gradient(to top,#000 85%,transparent)}
.info{position:absolute;bottom:0;left:0;right:0;padding:10px}
.name{font-family:'Orbitron';font-size:11px;font-weight:800}
.meta{font-size:9px;color:#00e5ff;margin-top:3px;text-transform:uppercase}
</style>
</head>
<body>
<div class="header"><div class="logo">DJEDITZ <span>VAULT</span></div></div>
<div class="grid">

<a class="card" href="YOUR_MEGA_LINK_GOJO" target="_blank">
<img src="https://cdn.myanimelist.net/images/characters/16/400228.jpg">
<div class="ov"></div><div class="info"><div class="name">GOJO SATORU</div><div class="meta">Six Eyes • Limitless</div></div>
</a>

<a class="card" href="#"><img src="https://cdn.myanimelist.net/images/characters/15/548419.jpg"><div class="ov"></div><div class="info"><div class="name">SUNG JINWOO</div><div class="meta">Arise • Monarch</div></div></a>

<a class="card" href="#"><img src="https://cdn.myanimelist.net/images/characters/9/582035.jpg"><div class="ov"></div><div class="info"><div class="name">EREN YEAGER</div><div class="meta">Founding Titan</div></div></a>

<a class="card" href="#"><img src="https://cdn.myanimelist.net/images/characters/9/105421.jpg"><div class="ov"></div><div class="info"><div class="name">TANJIRO</div><div class="meta">Hinokami Kagura</div></div></a>

<a class="card" href="#"><img src="https://cdn.myanimelist.net/images/characters/9/131317.jpg"><div class="ov"></div><div class="info"><div class="name">NARUTO</div><div class="meta">Nine Tails • Sage</div></div></a>

<a class="card" href="#"><img src="https://cdn.myanimelist.net/images/characters/7/72533.jpg"><div class="ov"></div><div class="info"><div class="name">LUFFY</div><div class="meta">Gear 5 • Joyboy</div></div></a>

</div>
</body>
</html>
