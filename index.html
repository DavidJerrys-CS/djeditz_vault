<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJEDITZ | Anime Twixtor Clips</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #080204;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Dynamic Content Container */
    #content-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 0;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff0033, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
      margin-bottom: 1rem;
      text-align: center;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: 1px solid rgba(255, 0, 51, 0.4);
      background: rgba(20, 5, 8, 0.7);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(10px);
      margin-bottom: 2rem;
      transition: all 0.3s ease;
    }

    .search-box:focus {
      border-color: #ff0033;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
    }

    /* Video Grid */
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .clip-card {
      background: rgba(20, 5, 8, 0.85);
      border: 1px solid rgba(255, 0, 51, 0.2);
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .clip-card:hover {
      transform: translateY(-5px);
      border-color: #ff0033;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
    }

    .clip-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .download-btn {
      display: inline-block;
      text-align: center;
      background: linear-gradient(45deg, #cc0029, #ff0033);
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: auto;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background: linear-gradient(45deg, #ff0033, #ff3355);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
    }

    @media (max-width: 600px) {
      .page-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Content Area -->
  <div id="content-container">
    <h1 class="page-title">Anime Twixtor Clips</h1>
    
    <input type="text" class="search-box" placeholder="Search anime twixtor clips..." id="searchInput">

    <div class="clips-grid" id="clipsGrid">
      <!-- Clip Item 1 -->
      <div class="clip-card">
        <h3 class="clip-title">Gojo Satoru - Unlimited Void</h3>
        <p style="color: #b3a2a5; font-size: 0.85rem;">Jujutsu Kaisen | 1080p 60FPS</p>
        <a href="#" class="download-btn" target="_blank">Download Clip</a>
      </div>

      <!-- Clip Item 2 -->
      <div class="clip-card">
        <h3 class="clip-title">Eren Yeager - Rumbling</h3>
        <p style="color: #b3a2a5; font-size: 0.85rem;">Attack on Titan | 1080p 60FPS</p>
        <a href="#" class="download-btn" target="_blank">Download Clip</a>
      </div>

      <!-- Clip Item 3 -->
      <div class="clip-card">
        <h3 class="clip-title">Rengoku vs Akaza</h3>
        <p style="color: #b3a2a5; font-size: 0.85rem;">Demon Slayer | 1080p 60FPS</p>
        <a href="#" class="download-btn" target="_blank">Download Clip</a>
      </div>
    </div>
  </div>

</body>
</html>
